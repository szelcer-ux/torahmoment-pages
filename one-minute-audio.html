<script src="/data/site-counts.js"></script>
<script>
const DATA_URL = "./data.json";

const q = document.getElementById("q");
const list = document.getElementById("list");
const count = document.getElementById("count");
const sortBtn = document.getElementById("sortBtn");

let items = [];
let filtered = [];
let sortLatestFirst = true;

function pauseAllExcept(current){
  document.querySelectorAll("audio").forEach(a=>{
    if (a !== current) a.pause();
  });
}

function esc(s){
  return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
}

function getSavedRate(){
  return Number(localStorage.getItem("rate") || "1");
}
function setSavedRate(r){
  localStorage.setItem("rate", String(r));
}

function sortItems(){
  filtered.sort((a,b)=> sortLatestFirst ? (b._sortKey - a._sortKey) : (a._sortKey - b._sortKey));
}

// "9/8/2024" -> key (UTC midnight)
function dateToKey(mdy){
  const m = String(mdy || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return 0;
  const mm = Number(m[1]);
  const dd = Number(m[2]);
  const yyyy = Number(m[3]);
  return Date.UTC(yyyy, mm - 1, dd);
}

function fmtTime(sec){
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

const SPEEDS = [1, 1.25, 1.5, 2];
function nextSpeed(cur){
  const i = SPEEDS.indexOf(cur);
  return SPEEDS[(i >= 0 ? i + 1 : 0) % SPEEDS.length];
}

function render(){
  sortItems();
  list.innerHTML = "";
  count.textContent = filtered.length + " items";

  // ✅ Feed the site-wide counter (for the GitHub Action JSON build)
  if (window.SITE_COUNTS?.allShiurim?.breakdown) {
    window.SITE_COUNTS.allShiurim.breakdown.oneMinute.audio = items.length;
    window.SITE_COUNTS.allShiurim.updated = new Date().toISOString().slice(0, 10);
  }

  const defaultRate = getSavedRate();

  filtered.forEach(it=>{
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.id = String(it.id);

    row.innerHTML = `
      <div class="head">
        <div class="date">${esc(it.date)}</div>
        <div class="title">${esc(it.description)}${it.category?`<span class="cattag" data-cat="${esc(it.category)}">${esc(it.category)}${it.categoryDetail&&it.category!=="Parsha"?" · "+esc(it.categoryDetail):(it.categoryDetail?" · "+esc(it.categoryDetail):"")}</span>`:""}</div>
      </div>

      <div class="tmPlayer" data-id="${it.id}">
        <button class="tmPlay" type="button" aria-label="Play/Pause">▶</button>
        <input class="tmSeek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <button class="tmSpeed" type="button" aria-label="Playback speed">${defaultRate}×</button>
        <div class="tmTime" aria-label="Time">0:00</div>

        <audio class="tmAudio" preload="none" data-audio-id="${it.id}">
          <source src="${esc(it.url)}" type="audio/mpeg">
        </audio>
      </div>
    `;

    list.appendChild(row);

    const audio = row.querySelector("audio.tmAudio");
    if (audio) audio.playbackRate = defaultRate;

    // Keep the time/seek UI updated for this row
    const seekEl = row.querySelector(".tmSeek");
    const timeEl = row.querySelector(".tmTime");
    const playBtn = row.querySelector(".tmPlay");

    audio?.addEventListener("loadedmetadata", () => {
      if (seekEl) seekEl.value = "0";
      if (timeEl) timeEl.textContent = "0:00";
    });

    audio?.addEventListener("timeupdate", () => {
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      const pct = audio.currentTime / audio.duration;
      if (seekEl) seekEl.value = String(Math.round(pct * 1000));
      if (timeEl) timeEl.textContent = fmtTime(audio.currentTime);
    });

    audio?.addEventListener("play", () => {
      pauseAllExcept(audio);
      if (playBtn) playBtn.textContent = "⏸";
      row.scrollIntoView({behavior:"smooth", block:"center"});
    });

    audio?.addEventListener("pause", () => {
      if (playBtn) playBtn.textContent = "▶";
    });

    audio?.addEventListener("ended", () => {
      if (playBtn) playBtn.textContent = "▶";
      if (seekEl) seekEl.value = "0";
    });
  });
}

// ✅ Event delegation for play/speed (ONE place)
list.addEventListener("click", (e) => {
  const player = e.target.closest(".tmPlayer");
  if (!player) return;

  const audio = player.querySelector("audio.tmAudio");
  if (!audio) return;

  // Play/pause
  if (e.target.closest(".tmPlay")) {
    e.preventDefault();
    e.stopPropagation();

    if (audio.paused) {
      pauseAllExcept(audio);
      audio.playbackRate = getSavedRate() || 1;
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
    return;
  }

  // Speed
  if (e.target.closest(".tmSpeed")) {
    e.preventDefault();
    e.stopPropagation();

    const btn = player.querySelector(".tmSpeed");
    const cur = Number(audio.playbackRate) || getSavedRate() || 1;
    const rate = nextSpeed(cur);

    audio.playbackRate = rate;
    setSavedRate(rate);
    if (btn) btn.textContent = `${rate}×`;
    return;
  }
});

list.addEventListener("input", (e) => {
  const seek = e.target.closest(".tmSeek");
  if (!seek) return;

  const player = seek.closest(".tmPlayer");
  const audio = player?.querySelector("audio.tmAudio");
  if (!audio || !isFinite(audio.duration) || audio.duration <= 0) return;

  const pct = Number(seek.value) / 1000;
  audio.currentTime = pct * audio.duration;
});

let activeCat = "", activeSub = "", activeSefer = "";
const SEFARIM = {
  "Bereishis":["Bereishis","Noach","Lech Licha","Vayeira","Chayei Sarah","Toldos","Vayeitzei","Vayishlach","Vayeishev","Mikeitz","Vayigash","Vayechi"],
  "Shemos":["Shemos","Vaeira","Bo","Beshalach","Yisro","Mishpatim","Terumah","Tetzaveh","Ki Sisa","Vayakhel","Pekudei"],
  "Vayikra":["Vayikra","Tzav","Shemini","Tazria","Metzora","Achrei Mos","Kedoshim","Emor","Behar","Bechukosai"],
  "Bamidbar":["Bamidbar","Naso","Behaaloscha","Shelach","Korach","Chukas","Balak","Pinchas","Matos","Masei"],
  "Devarim":["Devarim","Vaeschanan","Eikev","Reeh","Shoftim","Ki Seitzei","Ki Savo","Nitzavim","Vayeilech","Haazinu","Vezos Haberacha"]
};
function nk(x){return String(x||"").toLowerCase().replace(/[^a-z]/g,"");}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function parshaIdx(name,sef){ // index of the closest-spelled parsha in that sefer's order
  const k=nk(name); let best=0,bd=99; SEFARIM[sef].forEach((p,i)=>{const d=lev(k,nk(p)); if(d<bd){bd=d;best=i;}}); return best; }
const _sefCache = {};
function seferOf(name){
  if (name in _sefCache) return _sefCache[name];
  const k = nk(name); let best = "", bd = 99;
  for (const [sef, list] of Object.entries(SEFARIM)) for (const p of list) { const d = lev(k, nk(p)); if (d < bd) { bd = d; best = sef; } }
  return (_sefCache[name] = bd <= 3 ? best : "");
}
const catBar = document.getElementById("catBar"), subBar = document.getElementById("subBar"), parBar = document.getElementById("parBar");

function buildCats(){
  const m = new Map();
  items.forEach(it => { if (it.category) m.set(it.category, (m.get(it.category)||0)+1); });
  if (!m.size) { catBar.hidden = true; return; }
  const cats = [...m.entries()].sort((a,b)=>b[1]-a[1]);
  catBar.hidden = false;
  catBar.innerHTML = `<button data-cat="" class="${activeCat?"":"on"}">All<small>${items.length}</small></button>` +
    cats.map(([c,n])=>`<button data-cat="${esc(c)}" class="${c===activeCat?"on":""}">${esc(c)}<small>${n}</small></button>`).join("");
  // sub-chips: for Parsha -> 5 sefarim, then that sefer's parshiyos; otherwise detail chips
  const subs = new Map();
  if (activeCat) items.filter(it=>it.category===activeCat && it.categoryDetail).forEach(it=>subs.set(it.categoryDetail,(subs.get(it.categoryDetail)||0)+1));
  parBar.hidden = true; parBar.innerHTML = "";
  if (activeCat === "Parsha") {
    if (activeSub && !activeSefer) activeSefer = seferOf(activeSub);
    const sc = {}; for (const [n,c] of subs) { const sf = seferOf(n); if (sf) sc[sf] = (sc[sf]||0)+c; }
    subBar.hidden = false;
    subBar.innerHTML = Object.keys(SEFARIM).map(sf => {
      const n = sc[sf]||0;
      return `<button data-sefer="${sf}" class="${sf===activeSefer?"on":""}" ${n?"":"disabled style=\"opacity:.45;cursor:default\""}>${sf}<small>${n}</small></button>`;
    }).join("");
    if (activeSefer) {
      const ps = [...subs.entries()].filter(([n])=>seferOf(n)===activeSefer)
        .sort((a,b)=>parshaIdx(a[0],activeSefer)-parshaIdx(b[0],activeSefer));
      parBar.hidden = false;
      parBar.innerHTML = `<button data-sub="" class="${activeSub?"":"on"}">All ${esc(activeSefer)}</button>` +
        ps.map(([n,c])=>`<button data-sub="${esc(n)}" class="${n===activeSub?"on":""}">${esc(n)}<small>${c}</small></button>`).join("");
    }
  } else if (subs.size > 1) {
    subBar.hidden = false;
    subBar.innerHTML = `<button data-sub="" class="${activeSub?"":"on"}">All ${esc(activeCat)}</button>` +
      [...subs.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([c,n])=>`<button data-sub="${esc(c)}" class="${c===activeSub?"on":""}">${esc(c)}<small>${n}</small></button>`).join("");
  } else { subBar.hidden = true; subBar.innerHTML = ""; }
}

function setCat(c, sub, sefer){
  activeCat = c || ""; activeSub = sub || ""; activeSefer = (c === "Parsha") ? (sefer || "") : "";
  try {
    const u = new URL(location.href);
    if (activeCat) u.searchParams.set("cat", activeCat); else u.searchParams.delete("cat");
    if (activeSub) u.searchParams.set("sub", activeSub); else u.searchParams.delete("sub");
    if (activeSefer) u.searchParams.set("sefer", activeSefer); else u.searchParams.delete("sefer");
    history.replaceState(null, "", u);
  } catch(e){}
  buildCats(); applySearch();
}

catBar.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setCat(b.dataset.cat, ""); });
subBar.addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.sefer) setCat("Parsha", "", b.dataset.sefer === activeSefer ? "" : b.dataset.sefer);
  else setCat(activeCat, b.dataset.sub); });
parBar.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setCat("Parsha", b.dataset.sub, activeSefer); });
list.addEventListener("click", e => { const t = e.target.closest(".cattag"); if (t) { setCat(t.dataset.cat, ""); window.scrollTo({top:0,behavior:"smooth"}); } });

function applySearch(){
  const v = (q.value||"").toLowerCase().trim();
  filtered = items.filter(it => {
    if (activeCat && it.category !== activeCat) return false;
    if (activeSub && it.categoryDetail !== activeSub) return false;
    if (activeCat === "Parsha" && activeSefer && !activeSub && seferOf(it.categoryDetail) !== activeSefer) return false;
    if (!v) return true;
    return (it.description||"").toLowerCase().includes(v) ||
      (it.date||"").toLowerCase().includes(v) ||
      (it.category||"").toLowerCase().includes(v) ||
      (it.categoryDetail||"").toLowerCase().includes(v);
  });
  render();
}

sortBtn.onclick = () => {
  sortLatestFirst = !sortLatestFirst;
  sortBtn.textContent = sortLatestFirst ? "Latest ↓" : "Oldest ↑";
  render();
};

q.oninput = applySearch;

fetch(DATA_URL, { cache:"no-store" })
  .then(r => r.json())
  .then(d => {
    items = d.map((x, idx) => ({
      ...x,
      description: String(x.description||"").replace(/\s*<This message was edited>\s*/gi, "").trim(),
      categoryDetail: (x.category==="Yomim Tovim" && /^(Rosh Hashana|Yom Kippur|Sukkos)$/.test(x.categoryDetail||"")) ? "Elul/Tishrei" : x.categoryDetail,
      id: x.id ?? idx,
      _sortKey: dateToKey(x.date)
    }));
    filtered = items.slice();
    sortLatestFirst = true;
    sortBtn.textContent = "Latest ↓";
    try {
      const p = new URLSearchParams(location.search);
      activeCat = p.get("cat") || ""; activeSub = p.get("sub") || ""; activeSefer = p.get("sefer") || "";
      if (activeCat && !items.some(it => it.category === activeCat)) { activeCat = ""; activeSub = ""; }
    } catch(e){}
    buildCats();
    applySearch();
  })
  .catch(err => {
    console.error("Failed to load data.json", err);
  });
</script>

<script>
(function(){
  const q = (new URLSearchParams(location.search).get("q") || "").trim();
  if(!q) return;

  // try common search inputs used on your pages
  const input =
    document.querySelector("#searchInput") ||
    document.querySelector("#q") ||
    document.querySelector('input[type="search"]');

  if(!input) return;

  input.value = q;
  input.dispatchEvent(new Event("input", { bubbles:true }));
})();
</script>

<script>
(function applyGlobalSearchOneMinute(){
  const params = new URLSearchParams(location.search);
  const q = (params.get("q") || "").trim();
  if (!q) return;

  function fire() {
    const inp = document.getElementById("q");
    if (!inp) return false;

    inp.value = q;

    // trigger your existing input listener
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    inp.dispatchEvent(new Event("change", { bubbles: true }));

    // if your page has a known function, call it too (safe if missing)
    if (typeof window.applyFilters === "function") window.applyFilters();
    if (typeof window.render === "function") window.render();

    return true;
  }

  // 1) try immediately
  fire();

  // 2) try after DOM is ready
  window.addEventListener("DOMContentLoaded", () => {
    fire();
    setTimeout(fire, 100);
    setTimeout(fire, 350);
    setTimeout(fire, 800);
  });

  // 3) try after everything is loaded (JSON fetches etc. often finish by then)
  window.addEventListener("load", () => {
    fire();
    setTimeout(fire, 150);
  });
})();
</script>

  });
})();
