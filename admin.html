<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TorahMoment Admin</title>
  <style>
    :root { --accent: #0d9488; --border: #e7e7ee; --bg: #f7f7f8; --card: #fff; --muted: #666; --radius: 12px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #111; }
    
    #loginScreen { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; width: 100%; max-width: 340px; text-align: center; }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
    .login-box button { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    #loginErr { color: #b42318; font-size: 13px; margin-bottom: 8px; display: none; }

    #mainScreen { display: none; }
    .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 15px; font-weight: 700; }
    .topbar button { font-size: 12px; padding: 5px 12px; border: 1px solid var(--border); background: none; border-radius: 6px; cursor: pointer; }
    
    .wrap { max-width: 620px; margin: 0 auto; padding: 24px 20px; }
    
    .token-banner { background: #fffbeb; border: 1px solid #fcd34d; border-radius: var(--radius); padding: 14px; margin-bottom: 18px; font-size: 13px; }
    .token-banner b { display: block; margin-bottom: 6px; }
    .token-row { display: flex; gap: 8px; margin-top: 8px; }
    .token-row input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: monospace; }
    .token-row button { padding: 8px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
    .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .f { margin-bottom: 12px; }
    .f label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
    .f input, .f select, .f textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; font-family: inherit; }
    .f input:focus, .f select:focus { border-color: var(--accent); outline: none; }
    .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .btn { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
    .btn-outline { background: var(--card); border: 1px solid var(--border); color: #111; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    #preview { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius); padding: 14px; margin-bottom: 12px; display: none; }
    #preview h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #166534; margin-bottom: 8px; }
    #preview pre { font-size: 12px; font-family: monospace; color: #166534; white-space: pre-wrap; }

    #status { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; margin-top: 10px; }
    #status.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    #status.err { background: #fef2f2; border: 1px solid #fecaca; color: #b42318; }
    #status.loading { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>🕍 TorahMoment Admin</h1>
    <p>Enter password to continue</p>
    <div id="loginErr">Incorrect password</div>
    <input type="password" id="pw" placeholder="Password" />
    <button id="loginBtn">Sign in</button>
  </div>
</div>

<div id="mainScreen">
  <div class="topbar">
    <h1>TorahMoment Admin</h1>
    <button id="logoutBtn">Sign out</button>
  </div>
  <div class="wrap">

    <div class="token-banner" id="tokenBanner">
      <b>⚠️ GitHub Token Required</b>
      Paste a GitHub personal access token (repo scope) to save to the repo.
      <div class="token-row">
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" />
        <button id="saveTokenBtn">Save</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" id="tab-halacha">📚 Halacha</button>
      <button class="tab" id="tab-oneMinute">⏱️ One-Minute</button>
      <button class="tab" id="tab-infographics">🖼️ Infographics</button>
    </div>

    <!-- HALACHA -->
    <div class="card" id="form-halacha">
      <h2>Add Halacha Shiur</h2>
      <div class="f"><label>Category</label><select id="hal-cat"></select></div>
      <div class="f"><label>Subcategory (optional)</label><select id="hal-sub"><option value="">— none —</option></select></div>
      <div class="f"><label>Title</label><input type="text" id="hal-title" placeholder="e.g. The laws of Muktzeh" /></div>
      <div class="f"><label>Audio URL</label><input type="url" id="hal-url" placeholder="https://www.buzzsprout.com/..." /></div>
      <div class="f2">
        <div class="f"><label>Date</label><input type="date" id="hal-date" /></div>
        <div class="f"><label>Type</label><select id="hal-type"><option value="audio">Audio</option><option value="youtube">YouTube</option></select></div>
      </div>
    </div>

    <!-- ONE-MINUTE -->
    <div class="card" id="form-oneMinute" style="display:none;">
      <h2>Add One-Minute Torah</h2>
      <div class="f"><label>Description (title)</label><input type="text" id="om-desc" placeholder="e.g. The importance of Shema" /></div>
      <div class="f"><label>Audio URL</label><input type="url" id="om-url" placeholder="https://2mishnasaday.com/wp-content/uploads/PTT-..." /></div>
      <div class="f2">
        <div class="f"><label>Date</label><input type="date" id="om-date" /></div>
        <div class="f"><label>Filename (auto from URL)</label><input type="text" id="om-file" placeholder="PTT-20260819-WA0005.mp3" /></div>
      </div>
    </div>

    <!-- INFOGRAPHICS -->
    <div class="card" id="form-infographics" style="display:none;">
      <h2>Add Parsha Infographic</h2>
      <div class="f"><label>YouTube Video ID</label><input type="text" id="ig-id" placeholder="e.g. GiYs0ntVDuI" /></div>
      <div class="f"><label>Title</label><input type="text" id="ig-title" placeholder="e.g. Leading by example" /></div>
      <div class="f2">
        <div class="f"><label>Parsha</label><input type="text" id="ig-parsha" placeholder="e.g. Achrei Mos" /></div>
        <div class="f"><label>Featured?</label><select id="ig-featured"><option value="no">No</option><option value="yes">Yes</option></select></div>
      </div>
      <div class="f"><label>Description</label><input type="text" id="ig-desc" placeholder="e.g. The ripple effect of personal integrity." /></div>
      <div class="f"><label>Image path</label><input type="text" id="ig-image" placeholder="/images/infographics/parsha/filename.png" /></div>
    </div>

    <div id="preview"><h3>Preview</h3><pre id="previewPre"></pre></div>

    <div class="btn-row">
      <button class="btn btn-outline" id="previewBtn">👁 Preview</button>
      <button class="btn btn-primary" id="commitBtn">💾 Save to GitHub</button>
    </div>
    <div id="status"></div>

  </div>
</div>

<script>
var REPO = 'szelcer-ux/torahmoment-pages';
var BRANCH = 'main';
var PW = 'TorahMoment613';
var currentTab = 'halacha';
var halachaData = null;

// ── Login ──
document.getElementById('loginBtn').addEventListener('click', function() {
  if (document.getElementById('pw').value === PW) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    onLogin();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
});

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('pw').value = '';
});

// ── Token ──
document.getElementById('saveTokenBtn').addEventListener('click', function() {
  var t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('tm_token', t);
  document.getElementById('tokenBanner').style.display = 'none';
  showStatus('Token saved!', 'ok');
});

function getToken() { return localStorage.getItem('tm_token') || ''; }

// ── On login ──
function onLogin() {
  if (getToken()) document.getElementById('tokenBanner').style.display = 'none';
  var today = new Date().toISOString().slice(0, 10);
  document.getElementById('hal-date').value = today;
  document.getElementById('om-date').value = today;
  loadHalachaCategories();
}

// ── Halacha categories ──
function loadHalachaCategories() {
  fetch('/data/halacha.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      halachaData = data;
      var sel = document.getElementById('hal-cat');
      sel.innerHTML = '<option value="">— select —</option>';
      data.forEach(function(cat, i) {
        var o = document.createElement('option');
        o.value = i;
        o.textContent = cat.category;
        sel.appendChild(o);
      });
    })
    .catch(function(e) { console.warn('Could not load halacha:', e); });
}

document.getElementById('hal-cat').addEventListener('change', function() {
  var sel = document.getElementById('hal-sub');
  sel.innerHTML = '<option value="">— none —</option>';
  var idx = this.value;
  if (idx === '' || !halachaData) return;
  (halachaData[idx].subcategories || []).forEach(function(sub, i) {
    var o = document.createElement('option');
    o.value = i;
    o.textContent = sub.name;
    sel.appendChild(o);
  });
});

// ── Tabs ──
['halacha', 'oneMinute', 'infographics'].forEach(function(key) {
  document.getElementById('tab-' + key).addEventListener('click', function() {
    currentTab = key;
    ['halacha', 'oneMinute', 'infographics'].forEach(function(k) {
      document.getElementById('tab-' + k).className = 'tab' + (k === key ? ' on' : '');
      document.getElementById('form-' + k).style.display = k === key ? 'block' : 'none';
    });
    document.getElementById('preview').style.display = 'none';
    document.getElementById('status').style.display = 'none';
  });
});

// ── Build entry ──
function toSlashDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return parseInt(p[1]) + '/' + parseInt(p[2]) + '/' + p[0];
}

function buildEntry() {
  if (currentTab === 'halacha') {
    var title = document.getElementById('hal-title').value.trim();
    var url   = document.getElementById('hal-url').value.trim();
    var date  = toSlashDate(document.getElementById('hal-date').value);
    var type  = document.getElementById('hal-type').value;
    if (!title || !url || !date) throw new Error('Title, URL and Date are required.');
    return { type: type, title: title, url: url, note: date };
  }
  if (currentTab === 'oneMinute') {
    var desc = document.getElementById('om-desc').value.trim();
    var url  = document.getElementById('om-url').value.trim();
    var date = toSlashDate(document.getElementById('om-date').value);
    if (!desc || !url || !date) throw new Error('Description, URL and Date are required.');
    var fname = document.getElementById('om-file').value.trim() || url.split('/').pop();
    return { date: date, description: desc, filename: fname, url: url };
  }
  if (currentTab === 'infographics') {
    var id    = document.getElementById('ig-id').value.trim();
    var title = document.getElementById('ig-title').value.trim();
    var parsha = document.getElementById('ig-parsha').value.trim();
    if (!id || !title || !parsha) throw new Error('Video ID, Title and Parsha are required.');
    var entry = {
      title: title,
      parsha: parsha,
      image: document.getElementById('ig-image').value.trim(),
      youtube: 'https://www.youtube.com/watch?v=' + id,
      description: document.getElementById('ig-desc').value.trim()
    };
    if (document.getElementById('ig-featured').value === 'yes') entry.featured = true;
    return { _key: id, entry: entry };
  }
}

// ── Preview ──
document.getElementById('previewBtn').addEventListener('click', function() {
  try {
    var e = buildEntry();
    document.getElementById('previewPre').textContent = JSON.stringify(e, null, 2);
    document.getElementById('preview').style.display = 'block';
    document.getElementById('status').style.display = 'none';
  } catch(err) {
    showStatus(err.message, 'err');
  }
});

// ── Commit ──
document.getElementById('commitBtn').addEventListener('click', function() {
  var btn = this;
  var token = getToken();
  if (!token) { showStatus('Please save your GitHub token first.', 'err'); return; }

  var entry;
  try { entry = buildEntry(); } catch(err) { showStatus(err.message, 'err'); return; }

  btn.disabled = true;
  showStatus('Fetching file from GitHub…', 'loading');

  var paths = { halacha: 'data/halacha.json', oneMinute: 'data.json', infographics: 'data/infographics.json' };
  var path = paths[currentTab];

  fetch('https://api.github.com/repos/' + REPO + '/contents/' + path + '?ref=' + BRANCH, {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
  })
  .then(function(r) {
    if (!r.ok) throw new Error('GitHub API error ' + r.status + ' — check your token has repo scope.');
    return r.json();
  })
  .then(function(meta) {
    var sha = meta.sha;
    var current = JSON.parse(atob(meta.content.replace(/\n/g, '')));
    var updated;

    if (currentTab === 'infographics') {
      updated = Object.assign({}, current);
      if (entry.entry.featured) Object.values(updated).forEach(function(v) { delete v.featured; });
      updated[entry._key] = entry.entry;
    } else if (currentTab === 'halacha') {
      updated = JSON.parse(JSON.stringify(current));
      var catIdx = parseInt(document.getElementById('hal-cat').value);
      var subVal = document.getElementById('hal-sub').value;
      if (subVal !== '') {
        updated[catIdx].subcategories[parseInt(subVal)].items.unshift(entry);
      } else {
        if (!updated[catIdx].items) updated[catIdx].items = [];
        updated[catIdx].items.unshift(entry);
      }
    } else {
      updated = [entry].concat(current);
    }

    showStatus('Saving…', 'loading');
    var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2) + '\n')));
    var label = entry.title || entry.description || entry._key || 'new entry';

    return fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Add ' + currentTab + ': ' + label, content: encoded, sha: sha, branch: BRANCH })
    });
  })
  .then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error('Commit failed: ' + t); });
    var label = entry.title || entry.description || entry._key || 'entry';
    showStatus('✅ Saved! "' + label + '" committed to ' + path + '. The GitHub Action will update the site shortly.', 'ok');
    clearForm();
  })
  .catch(function(err) {
    showStatus('❌ ' + err.message, 'err');
  })
  .finally(function() {
    btn.disabled = false;
  });
});

function clearForm() {
  var today = new Date().toISOString().slice(0, 10);
  if (currentTab === 'halacha') {
    document.getElementById('hal-title').value = '';
    document.getElementById('hal-url').value = '';
    document.getElementById('hal-date').value = today;
    document.getElementById('hal-cat').value = '';
    document.getElementById('hal-sub').innerHTML = '<option value="">— none —</option>';
  } else if (currentTab === 'oneMinute') {
    document.getElementById('om-desc').value = '';
    document.getElementById('om-url').value = '';
    document.getElementById('om-file').value = '';
    document.getElementById('om-date').value = today;
  } else {
    document.getElementById('ig-id').value = '';
    document.getElementById('ig-title').value = '';
    document.getElementById('ig-parsha').value = '';
    document.getElementById('ig-desc').value = '';
    document.getElementById('ig-image').value = '';
    document.getElementById('ig-featured').value = 'no';
  }
  document.getElementById('preview').style.display = 'none';
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
}
</script>
</body>
</html>
