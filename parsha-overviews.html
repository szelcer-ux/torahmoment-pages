  <style>
    :root{
      --bg:#f7f7f8;
      --card:#ffffff;
      --text:#111;
      --muted:#666;
      --border:#e7e7ee;
      --border-strong:#d0d0dc;
      --accent:#0d9488;
      --accent-mid:rgba(13,148,136,.3);
      --shadow:0 4px 16px rgba(0,0,0,.06);
      --radius:14px;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{margin:0;padding:0;}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}

    /* Topbar */
    .tm-topbar{width:100%;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
    .tm-topbar-inner{max-width:900px;margin:0 auto;padding:0 20px;display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;height:46px;position:relative;}
    .tm-topbar-inner::-webkit-scrollbar{display:none;}
    .tm-topbar a,.tm-topbar a:visited{text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;padding:0 11px;height:46px;display:inline-flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s;}
    .tm-topbar a:hover{color:var(--text);}
    .tm-topbar a.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
    .tm-topbar a+a{border-left:1px solid rgba(0,0,0,.06);margin-left:4px;padding-left:11px;}
    .tm-topbar .home-link{padding:0 12px 0 0;border-right:1px solid var(--border);margin-right:6px;border-bottom:none!important;display:flex;align-items:center;}
    .tm-topbar .home-link svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;}

    /* Book banner */
    .book-banner{display:flex;align-items:center;justify-content:center;gap:10px;background:#f4f4f0;color:#111;font-size:14px;font-weight:600;text-decoration:none;padding:9px 16px;letter-spacing:.01em;border-bottom:1px solid #e0e0d8;transition:background .15s;}
    .book-banner:hover{background:#ececec;}
    .book-banner img{height:32px;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.2);}

    /* Layout */
    .wrap{max-width:900px;margin:0 auto;padding:22px 20px 48px;}

    /* Hero */
    .hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px 18px;margin-bottom:18px;}
    .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .hero h1{margin:0 0 6px;font-size:clamp(1.4rem,3vw,1.8rem);line-height:1.1;letter-spacing:-.02em;}
    .hero-sub{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5;}
    .hero-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .count-val{font-size:13px;color:var(--muted);}

    /* Featured latest */
    .featured{background:rgba(13,148,136,.06);border:1px solid rgba(13,148,136,.25);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;}
    .featured-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--card);border:1px solid var(--accent-mid);border-radius:999px;padding:2px 9px;margin-bottom:8px;}
    .featured-parsha{font-size:18px;font-weight:700;line-height:1.25;margin-bottom:3px;}
    .featured-title{font-size:17px;font-weight:700;line-height:1.25;margin-bottom:3px;}
    .featured-date{font-size:12px;color:var(--muted);margin-bottom:12px;}

    /* Sefer filter */
    .sefer-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
    .sefer-btn{padding:7px 15px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;font-family:inherit;}
    .sefer-btn:hover{border-color:var(--accent);color:var(--accent);}
    .sefer-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

    /* Sefer label */
    .sefer-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px 2px;}

    /* Shiur cards */
    .shiur-list{display:flex;flex-direction:column;gap:10px;}
    .shiur-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .shiur-top{display:flex;align-items:center;gap:12px;padding:13px 16px 0;}
    .shiur-num{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;}
    .shiur-info{flex:1;min-width:0;}
    .shiur-parsha{font-size:15px;font-weight:700;line-height:1.3;color:var(--text);}
    .shiur-title{font-size:14px;font-weight:700;line-height:1.3;color:var(--text);}
    .shiur-meta{font-size:11px;color:var(--muted);margin-top:2px;}

    /* Inline player */
    .tm-inline-player{display:grid;grid-template-columns:30px 30px 1fr auto;align-items:center;gap:7px;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;}
    .tm-play,.tm-rewind{width:30px;height:30px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:#fff;}
    .tm-play{background:var(--accent);}
    .tm-play:hover{background:#0a7a6f;}
    .tm-rewind{background:var(--muted);}
    .tm-rewind:hover{background:#555;}
    .tm-play svg,.tm-rewind svg{width:13px;height:13px;display:block;}
    .tm-progress-wrap{min-width:0;width:100%;}
    .tm-progress{width:100%;appearance:none;height:3px;border-radius:999px;background:#dfe5eb;outline:none;cursor:pointer;}
    .tm-progress::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
    .tm-progress::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
    .tm-controls{display:flex;align-items:center;gap:6px;}
    .tm-pill{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:11px;cursor:pointer;white-space:nowrap;}
    .tm-time{color:var(--muted);font-size:11px;white-space:nowrap;min-width:36px;text-align:right;}

    .empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;color:var(--muted);text-align:center;}

    @media(max-width:640px){
      .wrap{padding:16px 14px 40px;}
    }
  </style>
</head>
<body>

<!-- NAV -->
<div class="tm-topbar">

</div>

<a href="https://www.amazon.com/dp/B0GWWH92N1" target="_blank" rel="noopener" class="book-banner">
  <img src="https://m.media-amazon.com/images/I/61YMvLIQFhL._AC_UY218_.jpg" alt="A Gutten Erev Shabbos" />

<div class="wrap">

  <div class="hero">
    <div class="hero-eyebrow">🗺️ Parsha Overviews</div>
    <h1>Weekly Parsha Overviews</h1>
    <p class="hero-sub">A general overview and key themes of each Parsha.</p>
    <div class="hero-meta">
      <div class="count-val" id="countVal">Loading…</div>
    </div>
  </div>

  <div id="featuredWrap" style="display:none;" class="featured">
    <div class="featured-badge">Latest</div>
    <div id="featuredParsha" class="featured-parsha"></div>
    <div id="featuredDate" class="featured-date"></div>
    <div id="featuredPlayer"></div>
  </div>

  <div class="sefer-filter" id="seferFilter"></div>

  <div id="shiurList"></div>

</div>

<script>
  const PLAY_ICON  = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  const PAUSE_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>`;
  const REWIND_ICON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 12L19 6v12l-7.5-6zm-8 0L11 6v12l-7.5-6z"/></svg>`;

  // Canonical parsha order for sorting
  const PARSHA_ORDER = [
    'bereishis','noach','lech lecha','vayeira','chayei sara','toldos','vayeitzei','vayishlach','vayeishev','miketz','vayigash','vayechi',
    'shemos','vaeira','bo','beshalach','yisro','mishpatim','terumah','tetzaveh','ki sisa','vayakhel','pekudei',
    'vayikra','tzav','shemini','tazria','metzora','achrei mos','kedoshim','emor','behar','bechukosai',
    'bamidbar','nasso','behaaloscha','shelach','korach','chukas','balak','pinchas','matos','massei',
    'devarim','vaeschanan','eikev','reeh','shoftim','ki seitzei','ki savo','nitzavim','vayeilech','haazinu','vezos haberacha'
  ];

  const SEFANIM = [
    { name: 'Sefer Bereishis', parshas: ['bereishis','noach','lech lecha','vayeira','chayei sara','toldos','vayeitzei','vayishlach','vayeishev','miketz','vayigash','vayechi'] },
    { name: 'Sefer Shemos',    parshas: ['shemos','vaeira','bo','beshalach','yisro','mishpatim','terumah','tetzaveh','ki sisa','vayakhel','pekudei'] },
    { name: 'Sefer Vayikra',   parshas: ['vayikra','tzav','shemini','tazria','metzora','achrei mos','kedoshim','emor','behar','bechukosai'] },
    { name: 'Sefer Bamidbar',  parshas: ['bamidbar','nasso','behaaloscha','shelach','korach','chukas','balak','pinchas','matos','massei'] },
    { name: 'Sefer Devarim',   parshas: ['devarim','vaeschanan','eikev','reeh','shoftim','ki seitzei','ki savo','nitzavim','vayeilech','haazinu','vezos haberacha'] },
  ];

  const P_ALIAS = { 'lech licha':'lech lecha','chayei sarah':'chayei sara','mekeitz':'miketz','vayichi':'vayechi','naso':'nasso','masei':'massei' };
  function normP(s) { const k = String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(); return P_ALIAS[k] || k; }

  function parshaFromItem(item) {
    // Extract parsha name from id like "ov-devarim" or title
    if (item.id) {
      const p = item.id.replace(/^ov-/,'').replace(/-/g,' ');
      return p.replace(/\b\w/g, c=>c.toUpperCase());
    }
    return '';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }

  function renderPlayer(url, containerId) {
    return `<div class="tm-inline-player" data-url="${url}">
      <button class="tm-play" type="button" aria-label="Play">${PLAY_ICON}</button>
      <button class="tm-rewind" type="button" aria-label="Rewind 15 seconds">${REWIND_ICON}</button>
      <div class="tm-progress-wrap">
        <input class="tm-progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      </div>
      <div class="tm-controls">
        <button class="tm-pill" type="button">1×</button>
        <span class="tm-time"></span>
      </div>
      <audio preload="none" src="${url}"></audio>
    </div>`;
  }

  function setupPlayer(playerEl) {
    const audio    = playerEl.querySelector('audio');
    const playBtn  = playerEl.querySelector('.tm-play');
    const rewindBtn= playerEl.querySelector('.tm-rewind');
    const seek     = playerEl.querySelector('.tm-progress');
    const speedBtn = playerEl.querySelector('.tm-pill');
    const timeEl   = playerEl.querySelector('.tm-time');
    if (!audio||!playBtn||!seek||!speedBtn||!timeEl) return;

    const speeds = [1, 1.25, 1.5, 1.75, 2];
    let si = 0;

    function fmt(s) { return Number.isFinite(s)&&s>=0?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:''; }
    function tick() {
      const d=audio.duration||0, c=audio.currentTime||0;
      if (d>0){seek.value=(c/d)*100; timeEl.textContent=fmt(d);}
      else{seek.value=0; timeEl.textContent='';}
    }

    playBtn.addEventListener('click', async()=>{
      document.querySelectorAll('.tm-inline-player audio').forEach(a=>{
        if(a!==audio){a.pause();const b=a.closest('.tm-inline-player')?.querySelector('.tm-play');if(b)b.innerHTML=PLAY_ICON;}
      });
      if(audio.paused){
        try{await audio.play();playBtn.innerHTML=PAUSE_ICON;
          if(typeof gtag==='function') gtag('event','play_shiur',{shiur_title:playerEl.closest('[data-title]')?.dataset.title||''});
        }catch(e){}
      } else {audio.pause();playBtn.innerHTML=PLAY_ICON;}
    });

    rewindBtn.addEventListener('click',()=>{
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });

    audio.addEventListener('play',  ()=>{playBtn.innerHTML=PAUSE_ICON;});
    audio.addEventListener('pause', ()=>{playBtn.innerHTML=PLAY_ICON;});
    audio.addEventListener('ended', ()=>{playBtn.innerHTML=PLAY_ICON; seek.value=0;});
    audio.addEventListener('loadedmetadata', tick);
    audio.addEventListener('timeupdate', tick);
    seek.addEventListener('input',()=>{ if(audio.duration) audio.currentTime=(seek.value/100)*audio.duration; });
    speedBtn.addEventListener('click',()=>{
      si=(si+1)%speeds.length;
      audio.playbackRate=speeds[si];
      speedBtn.textContent=`${speeds[si]}×`;
    });
    audio.playbackRate=speeds[si];
    speedBtn.textContent=`${speeds[si]}×`;
    tick();
  }

  let allItems = [];
  let selectedSefer = null; // sefer name, or 'all'

  function seferOf(item) {
    const p = normP(parshaFromItem(item));
    return SEFANIM.find(s => s.parshas.includes(p)) || null;
  }

  function renderList() {
    let html = '';
    SEFANIM.forEach(sefer => {
      if (selectedSefer !== 'all' && selectedSefer !== sefer.name) return;
      const sItems = allItems.filter(item => {
        const s = seferOf(item);
        return s && s.name === sefer.name;
      });
      if (!sItems.length) return;

      html += `<div class="sefer-label">${sefer.name}</div><div class="shiur-list">`;
      sItems.forEach(item => {
        const parsha  = parshaFromItem(item);
        const dateStr = fmtDate(item.date);
        const num     = sefer.parshas.indexOf(normP(parsha)) + 1;
        html += `<div class="shiur-card" data-title="${(item.title||'').replace(/"/g,'&quot;')}">
          <div class="shiur-top">
            <div class="shiur-num">${num}</div>
            <div class="shiur-info">
              <div class="shiur-parsha">${parsha}</div>
              ${dateStr?`<div class="shiur-meta">${dateStr}</div>`:''}
            </div>
          </div>
          ${renderPlayer(item.url, '')}
        </div>`;
      });
      html += `</div>`;
    });
    document.getElementById('shiurList').innerHTML = html;
    document.querySelectorAll('#shiurList .tm-inline-player').forEach(setupPlayer);
  }

  function renderFilter() {
    const wrap = document.getElementById('seferFilter');
    const present = SEFANIM.filter(s => allItems.some(i => { const x = seferOf(i); return x && x.name === s.name; }));
    const buttons = present.map(s => ({ key: s.name, label: s.name.replace('Sefer ', '') }));
    buttons.push({ key: 'all', label: 'All' });
    wrap.innerHTML = buttons.map(b =>
      `<button type="button" class="sefer-btn${b.key === selectedSefer ? ' active' : ''}" data-sefer="${b.key}">${b.label}</button>`
    ).join('');
    wrap.querySelectorAll('.sefer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedSefer = btn.dataset.sefer;
        document.querySelectorAll('.sefer-btn').forEach(x => x.classList.toggle('active', x === btn));
        renderList();
      });
    });
  }

  async function loadOverviews() {
    try {
      const res = await fetch('/data/search-index.json',{cache:'no-store'});
      if (!res.ok) throw new Error('search-index.json not found');
      const idx = await res.json();

      const items = (idx||[]).filter(x=>x.program==='Parsha Overview'&&x.url);

      document.getElementById('countVal').textContent=`${items.length} shiur${items.length===1?'':'im'}`;

      if (!items.length) {
        document.getElementById('shiurList').innerHTML=`<div class="empty">No overviews yet — check back soon.</div>`;
        return;
      }

      // Sort by parsha order
      items.sort((a,b)=>{
        const ia = PARSHA_ORDER.indexOf(normP(parshaFromItem(a)));
        const ib = PARSHA_ORDER.indexOf(normP(parshaFromItem(b)));
        return (ia===-1?999:ia)-(ib===-1?999:ib);
      });
      allItems = items;

      // Latest = most recent by date
      const latest = [...items].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[0];

      // Featured
      const fw = document.getElementById('featuredWrap');
      if (latest) {
        document.getElementById('featuredParsha').textContent = parshaFromItem(latest);
        document.getElementById('featuredDate').textContent   = fmtDate(latest.date);
        document.getElementById('featuredPlayer').innerHTML   = renderPlayer(latest.url, 'featuredPlayer');
        fw.style.display='';
        fw.setAttribute('data-title', latest.title||'');
        setupPlayer(fw.querySelector('.tm-inline-player'));
      }

      // Default filter = sefer of the most recent overview
      const cur = seferOf(latest);
      selectedSefer = cur ? cur.name : 'all';

      renderFilter();
      renderList();

    } catch(e) {
      console.warn('Failed to load overviews:',e);
      document.getElementById('shiurList').innerHTML=`<div class="empty">Could not load overviews.</div>`;
      document.getElementById('countVal').textContent='';
    }
  }

  loadOverviews();

  // Active nav
  (function(){
    const links=document.querySelectorAll('.tm-topbar a[href]:not(.home-link)');
    const current=(location.pathname||'/').replace(/\/+$/,'')||'/';
    links.forEach(a=>{
      const lp=(new URL(a.href,location.href).pathname||'/').replace(/\/+$/,'')||'/';
      if(lp===current) a.classList.add('active');
    });
  })();
</script>

</body>
