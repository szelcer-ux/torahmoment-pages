:root{
  --bg:#f0f2f5;

  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --radius:12px;

  /* Per-page layout alignment (set these to match THAT page’s .wrap) */
  /* Example values below — change per page */
  --tm-wrap-max: 980px;
  --tm-wrap-pad: 18px;
}

    *, *::before, *::after{ box-sizing: border-box; }


    /* ===== TorahMoment Topbar ===== */
.tm-topbar{
  width:100%;
  background:#ffffff;
  border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.05);
  position:sticky;
  top:0;
  z-index:1000;
}

.tm-topbar-inner{
  box-sizing: border-box; /* critical: match wrap sizing */
  max-width: var(--tm-wrap-max, 980px);
  margin:0 auto;
  padding:0 var(--tm-wrap-pad, 20px);
  height:46px;
  display:flex;
  align-items:center;
  flex-wrap:nowrap;          /* never wrap */
  overflow-x:auto;           /* swipe on mobile */
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  position:relative;         /* for fade overlay */
}

.tm-topbar-inner::-webkit-scrollbar{ display:none; }

/* right-edge fade hint */
.tm-topbar-inner::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:28px;
  height:100%;
  pointer-events:none;
  background:linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1));
}

/* links (force consistent color incl. visited) */
.tm-topbar a,
.tm-topbar a:visited{
  text-decoration:none;
  color:var(--muted, #666);
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  padding:0 11px;
  height:46px;
  display:inline-flex;
  align-items:center;
  border-bottom:2px solid transparent;
}

.tm-topbar a:hover{ color:var(--text); }

/* Accessible active state: pill background (NOT color-only) */
/* Excludes home icon */
.tm-topbar a.active:not(.home-link),
.tm-topbar a.active:not(.home-link):visited{
  color:var(--accent) !important;
  font-weight:600;
  border-bottom:2px solid var(--accent);
}

/* separators */
.tm-topbar a + a{
  border-left:1px solid rgba(0,0,0,0.06);
  margin-left:4px;
  padding-left:11px;
}

/* home icon */
.tm-topbar .home-link{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 12px 0 0;
  border-right:1px solid var(--border);
  margin-right:6px;
  flex-shrink:0;
  border-bottom:none !important;
}
.tm-topbar .home-link svg{
  width:15px;
  height:15px;
}

/* Mobile tighten + “One Minute” -> “One-Min” */
@media (max-width: 520px){
  .tm-topbar-inner{ padding:0 12px; }
  .tm-topbar a, .tm-topbar a:visited{ font-size:13px; padding:0 8px; }
  .tm-topbar a + a{ margin-left:5px; padding-left:10px; }

  .tm-topbar a[href$="/one-minute-audio.html"]{ font-size:0; }
  .tm-topbar a[href$="/one-minute-audio.html"]::before{
    content:"One-Min";
    font-size:13px;
  }
}

function openCategoryFromURL(){
  const params = new URLSearchParams(location.search);
  const cat = (params.get("cat") || "").trim().toLowerCase();
  const sub = (params.get("sub") || "").trim().toLowerCase(); // optional

  if (!cat) return;

  // categories are <details class="category">
  const cats = Array.from(document.querySelectorAll('details.category'));

  // find matching category by its visible title
  const match = cats.find(d => {
    const titleEl = d.querySelector('.cat-title');
    const title = (titleEl?.textContent || "").trim().toLowerCase();
    return title === cat || title.includes(cat);
  });

  if (!match) {
    console.warn("[openCategoryFromURL] category not found:", cat);
    return;
  }

  // close others, open this one
  cats.forEach(d => d.removeAttribute("open"));
  match.setAttribute("open", "");

  // optional: open a subcategory (details.subcat) inside it
  if (sub) {
    const subs = Array.from(match.querySelectorAll('details.subcat'));
    const subMatch = subs.find(s => {
      const txt = (s.querySelector("summary span")?.textContent || "").trim().toLowerCase();
      return txt === sub || txt.includes(sub);
    });
    if (subMatch) subMatch.setAttribute("open", "");
  }

  // scroll to it
  match.scrollIntoView({ behavior:"smooth", block:"start" });
}

function openFromURLParams(){
  const p = new URLSearchParams(location.search);

  // support a few param names so links are easy
  const catQ = p.get("cat") || p.get("category") || "";
  const subQ = p.get("sub") || p.get("subcategory") || "";

  if (!catQ && !subQ) return;

  const catNeed = tmNorm(decodeURIComponent(catQ));
  const subNeed = tmNorm(decodeURIComponent(subQ));

  // categories
  const cats = Array.from(document.querySelectorAll('details.category'));
  let openedSomething = false;

  for (const d of cats){
    const titleEl = d.querySelector(".cat-title");
    const title = tmNorm(titleEl?.textContent);

    // if cat was provided, require it to match
    if (catNeed && title !== catNeed) continue;

    d.setAttribute("open", "");
    openedSomething = true;

    // optionally open a subcategory inside it
    if (subNeed){
      const subs = Array.from(d.querySelectorAll("details.subcat"));
      for (const sd of subs){
        const subTitle = tmNorm(sd.querySelector("summary span")?.textContent);
        if (subTitle === subNeed){
          sd.setAttribute("open", "");
          // scroll to the subcategory
          requestAnimationFrame(() => sd.scrollIntoView({ behavior:"smooth", block:"start" }));
          return;
        }
      }
    }

    // scroll to the category if we opened it
    requestAnimationFrame(() => d.scrollIntoView({ behavior:"smooth", block:"start" }));
    return;
  }

  // If only sub was provided (no cat), open the first matching sub anywhere
  if (!openedSomething && subNeed){
    const subs = Array.from(document.querySelectorAll("details.subcat"));
    for (const sd of subs){
      const subTitle = tmNorm(sd.querySelector("summary span")?.textContent);
      if (subTitle === subNeed){
        sd.setAttribute("open", "");
        sd.closest("details.category")?.setAttribute("open", "");
        requestAnimationFrame(() => sd.scrollIntoView({ behavior:"smooth", block:"start" }));
        return;
      }
    }
  }
}

function tmParseMmDdYyyy(s){
  const m = String(s || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const mo = Number(m[1]), d = Number(m[2]), y = Number(m[3]);
  const dt = new Date(y, mo - 1, d);
  return isFinite(dt) ? dt : null;
}

function tmDaysBetween(a, b){
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.floor((A - B) / 86400000);
}

function tmIsNewByNoteDate(note, days){
  const dt = tmParseMmDdYyyy(note);
  if (!dt) return false;
  const diff = tmDaysBetween(new Date(), dt);
  return diff >= 0 && diff <= days;
}

function tmFmtTime(sec){
  if (!isFinite(sec) || sec < 0) return "0:00";

  sec = Math.floor(sec);

  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;

  if (h > 0) {
    // hours:minutes:seconds
    return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  // minutes:seconds
  return `${m}:${String(s).padStart(2,"0")}`;
}


function tmWirePlayers(){
  const players = document.querySelectorAll(".tm-player");

  players.forEach(p => {
    const audio = p.querySelector("audio");
    const btn = p.querySelector(".tm-btn");
    const seek = p.querySelector(".tm-seek");
    const time = p.querySelector(".tm-time");

    if (!audio || !btn || !seek || !time) return;

    const update = () => {
      const dur = audio.duration || 0;
      const cur = audio.currentTime || 0;

      time.textContent = `${tmFmtTime(cur)} / ${dur ? tmFmtTime(dur) : "0:00"}`;

      if (dur) {
        seek.value = Math.floor((cur / dur) * 1000);
      } else {
        seek.value = 0;
      }

      btn.textContent = audio.paused ? "▶" : "⏸";
    };

    const pauseOthers = () => {
      document.querySelectorAll(".tm-player audio").forEach(a => {
        if (a !== audio) a.pause();
      });
    };

    btn.addEventListener("click", async () => {
      pauseOthers();
      if (audio.paused) {
        try { await audio.play(); } catch {}
      } else {
        audio.pause();
      }
      update();
    });

    seek.addEventListener("input", () => {
      const dur = audio.duration || 0;
      if (dur) audio.currentTime = (seek.value / 1000) * dur;
    });

    audio.addEventListener("loadedmetadata", update);
    audio.addEventListener("timeupdate", update);
    audio.addEventListener("play", update);
    audio.addEventListener("pause", update);
    audio.addEventListener("ended", update);

    update();
  });
}

function wireDesktopAccordion(){
  if (!window.matchMedia("(min-width: 768px)").matches) return;

  document.querySelectorAll("details.subcat").forEach(sub => {

    // prevent double wiring
    if (sub.dataset.accordionWired === "1") return;
    sub.dataset.accordionWired = "1";

    const summary = sub.querySelector("summary");

    summary.addEventListener("click", (e) => {
      e.preventDefault(); // we control toggle manually

      const isOpen = sub.hasAttribute("open");

      const parentCat = sub.closest("details.category");
      const siblings = parentCat.querySelectorAll("details.subcat");

      // close all siblings
      siblings.forEach(s => s.removeAttribute("open"));

      // toggle this one
      if (!isOpen) {
        sub.setAttribute("open", "");
        // ✅ auto-scroll opened panel into view (desktop only)
        requestAnimationFrame(() => {
          sub.scrollIntoView({ behavior: "smooth", block: "start" });
        });

      }
    });
  });
}


function wireNoteRows(){
  document.querySelectorAll(".tm-note-row").forEach(row => {
    row.addEventListener("click", () => {
      const url = row.getAttribute("data-url");
      if (url) {
        window.open(url, "_blank", "noopener");
      }
    });
  });
}

function wireYouTubeRows(){
  document.querySelectorAll(".tm-link-row").forEach(row => {
    row.addEventListener("click", () => {
      const url = row.getAttribute("data-url");
      if (url) window.open(url, "_blank", "noopener");
    });
  });
}
    
function tmWirePlaylistRows(){

  const rows = document.querySelectorAll(".tm-row");
  // Lazy-load metadata when row enters viewport
const io = new IntersectionObserver((entries) => {
  entries.forEach(({ isIntersecting, target }) => {
    if (!isIntersecting) return;

    const audio = target.querySelector("audio");
    if (!audio) return;

    if (!audio.getAttribute("src")) {
      const ds = audio.getAttribute("data-src");
      if (ds) {
        audio.setAttribute("src", ds);
        audio.preload = "metadata";
        audio.load();
      }
    }

    io.unobserve(target);
  });
}, { rootMargin: "250px" });

  
  rows.forEach(row => {
  // ✅ Prevent double-wiring (e.g., if tmWirePlaylistRows is called twice)
  if (row.dataset.wired === "1") return;
  row.dataset.wired = "1";
    
    const audio = row.querySelector("audio");
    const btn = row.querySelector(".tm-play");
    const durEl = row.querySelector(".tm-dur");
    const bar = row.querySelector(".tm-progress > div");
    const progressWrap = row.querySelector(".tm-progress");
    const speedBtn = row.querySelector(".tm-speed");
    const lenBadge = row.querySelector(".tm-len");

    if (!audio || !btn || !durEl || !bar) return;
    io.observe(row);

    const pauseOthers = () => {
      document.querySelectorAll(".tm-row audio").forEach(a => {
        if (a !== audio) a.pause();
      });
    };

    const updateBtn = () => {
      btn.textContent = audio.paused ? "▶" : "⏸";
    };

const updateDur = () => {
  if (audio.duration) {
    durEl.textContent = `(${tmFmtTime(audio.duration)})`;

    // ✅ short vs long badge (10 min cutoff)
    if (lenBadge) {
      const isLong = audio.duration >= 600; // 10 minutes
      lenBadge.textContent = isLong ? "Long" : "Short";
      lenBadge.classList.toggle("tm-long", isLong);
      lenBadge.classList.toggle("tm-short", !isLong);
      lenBadge.style.display = "";
    }
  }
};


    const updateProgress = () => {
      if (!audio.duration) { bar.style.width = "0%"; return; }
      const pct = (audio.currentTime / audio.duration) * 100;
      bar.style.width = `${Math.max(0, Math.min(100, pct))}%`;
    };

    // Play button click
    btn.addEventListener("click", async (e) => {
      e.stopPropagation(); // don't also trigger row click
      pauseOthers();
      if (audio.paused) {
        try { await audio.play(); } catch {}
      } else {
        audio.pause();
      }
      updateBtn();
    });

    // Whole row click (toggle play/pause)
    row.addEventListener("click", async (e) => {
      // If they clicked the progress bar, let the progress handler handle it
      if (e.target.closest(".tm-progress")) return;

      pauseOthers();
      if (audio.paused) {
        try { await audio.play(); } catch {}
      } else {
        audio.pause();
      }
      updateBtn();
    });

    // Click-to-seek on the progress bar
    if (progressWrap) {
      progressWrap.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent row toggle
        if (!audio.duration) return;

        const rect = progressWrap.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        const pct = x / rect.width;
        audio.currentTime = pct * audio.duration;
      });
    }

    audio.addEventListener("loadedmetadata", () => {
      updateDur();
      updateProgress();
      updateBtn();
    });

    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("play", updateBtn);
    audio.addEventListener("pause", updateBtn);
    audio.addEventListener("ended", () => {
      updateBtn();
      bar.style.width = "0%";
    });
// Playback speed control
if (speedBtn) {
  const speeds = [1, 1.5, 2];
  let speedIndex = 0;

  speedBtn.addEventListener("click", (e) => {
    e.stopPropagation(); // don't toggle play/pause
    speedIndex = (speedIndex + 1) % speeds.length;
    const newSpeed = speeds[speedIndex];
    audio.playbackRate = newSpeed;
    speedBtn.textContent = `${newSpeed}×`;
  });

  audio.addEventListener("loadedmetadata", () => {
    audio.playbackRate = speeds[speedIndex];
    speedBtn.textContent = `${speeds[speedIndex]}×`;
  });
}

    // Initial state
    updateBtn();
  });
}



    
    searchInput.addEventListener("input", render);
    render();
      })(); // end async IIFE
  </script>
